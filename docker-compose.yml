name: comprasegura

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: comprasegura/app:dev
    container_name: comprasegura_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - vendor-data:/var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - comprasegura_net

  webserver:
    image: nginx:1.27-alpine
    container_name: comprasegura_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - comprasegura_net

  db:
    image: postgres:18
    container_name: comprasegura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - comprasegura-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comprasegura_net

networks:
  comprasegura_net:
    driver: bridge

volumes:
  comprasegura-postgres:
  vendor-data:
