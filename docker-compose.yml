name: comprasegura

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  DB_CONNECTION: ${DB_CONNECTION}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  # MongoDB: la app entra con su propio usuario (creado por docker/mongo/init-mongo.js)
  MONGODB_URI: mongodb://${MONGO_USERNAME:-comprasegura}:${MONGO_PASSWORD:-secret}@mongodb:27017/${MONGODB_DATABASE:-comprasegura}?authSource=${MONGODB_DATABASE:-comprasegura}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-comprasegura}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: comprasegura/app:dev
    container_name: comprasegura_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - vendor-data:/var/www/html/vendor
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - comprasegura_net

  webserver:
    image: nginx:1.27-alpine
    container_name: comprasegura_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - comprasegura_net

  db:
    image: postgres:18
    container_name: comprasegura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - comprasegura-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comprasegura_net

  mongodb:
    image: mongo:8
    container_name: comprasegura_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootsecret}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-comprasegura}
      MONGO_APP_USERNAME: ${MONGO_USERNAME:-comprasegura}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:-secret}
    ports:
      - "${MONGO_FORWARD_PORT:-27017}:27017"
    volumes:
      - comprasegura-mongo:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - comprasegura_net

networks:
  comprasegura_net:
    driver: bridge

volumes:
  comprasegura-postgres:
  comprasegura-mongo:
  vendor-data:
