name: comprasegura

x-app-env: &app-env
  APP_NAME: ${APP_NAME}
  APP_ENV: production
  APP_DEBUG: false
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  MONGODB_URI: mongodb://${MONGO_USERNAME:?Falta MONGO_USERNAME en .env}:${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}@mongodb:27017/${MONGODB_DATABASE:-comprasegura}?authSource=${MONGODB_DATABASE:-comprasegura}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-comprasegura}
  BITACORA_DIAS_RETENCION: ${BITACORA_DIAS_RETENCION:-180}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION}
  PASARELA_PAGO: ${PASARELA_PAGO}
  PASARELA_SIMULADA_LIMITE_RECHAZO: ${PASARELA_SIMULADA_LIMITE_RECHAZO}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: comprasegura/app:prod
    container_name: comprasegura_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app-public:/var/www/html/public
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - comprasegura_net

  webserver:
    image: nginx:1.27-alpine
    container_name: comprasegura_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8002}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - comprasegura_net

  db:
    image: postgres:18
    container_name: comprasegura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - comprasegura-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comprasegura_net

  # Sin puerto publicado: solo la app la alcanza por la red interna de Docker
  mongodb:
    image: mongo:8
    container_name: comprasegura_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Falta MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-comprasegura}
      MONGO_APP_USERNAME: ${MONGO_USERNAME:?Falta MONGO_USERNAME en .env}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    volumes:
      - comprasegura-mongo:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - comprasegura_net

networks:
  comprasegura_net:
    driver: bridge

volumes:
  comprasegura-postgres:
  comprasegura-mongo:
  app-public:
