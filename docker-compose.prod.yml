name: comprasegura

x-app-env: &app-env
  APP_NAME: ${APP_NAME}
  APP_ENV: production
  APP_DEBUG: false
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION}
  PASARELA_PAGO: ${PASARELA_PAGO}
  PASARELA_SIMULADA_LIMITE_RECHAZO: ${PASARELA_SIMULADA_LIMITE_RECHAZO}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: comprasegura/app:prod
    container_name: comprasegura_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app-public:/var/www/html/public
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - comprasegura_net

  webserver:
    image: nginx:1.27-alpine
    container_name: comprasegura_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8002}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - comprasegura_net

  db:
    image: postgres:18
    container_name: comprasegura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - comprasegura-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - comprasegura_net

networks:
  comprasegura_net:
    driver: bridge

volumes:
  comprasegura-postgres:
  app-public:
