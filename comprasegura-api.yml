stages:
  - test
  - deploy

variables:
  DEPLOY_PATH: /srv/apps/comprasegura/api

test_api:
  stage: test
  image: php:8.4.27-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apt-get update && apt-get install -y git unzip libsqlite3-dev
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
    - php artisan test

deploy_api:
  stage: deploy
  tags:
    - home-server
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p "$DEPLOY_PATH"
    - rsync -a --delete --exclude='.git' --exclude='.env' "$CI_PROJECT_DIR"/ "$DEPLOY_PATH"/
    - cd "$DEPLOY_PATH"
    - test -f .env || (echo "Falta $DEPLOY_PATH/.env -- copia .env.production.example a .env y llenalo a mano (solo la primera vez)" && exit 1)
    - docker compose -f docker-compose.prod.yml build
    - docker compose -f docker-compose.prod.yml up -d
    - docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
