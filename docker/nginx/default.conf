server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # DNS interno de Docker. Con la direccion de "app" en una variable, Nginx la vuelve
    # a buscar cada 10 s; asi no da 502 cuando el contenedor app se recrea con otra IP
    # (por ejemplo, despues de "docker compose up -d --build").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
